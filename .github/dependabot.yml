version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      lint:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'stylelint*', 'prettier*']
      test:
        patterns: ['@playwright/test', '@axe-core/*', 'vitest', 'happy-dom', '@lhci/cli']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
